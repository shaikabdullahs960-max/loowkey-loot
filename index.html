<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lowkey Loot | Curated Online Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- SCRIPT MOVED TO TOP SO IT NEVER GETS CUT OFF ON MOBILE PASTE -->
    <script>
        var CONFIG = {
            storeName: "Lowkey Loot",
            upiId: "6301015838@ibl",
            ownerEmail: "lowkeyloot.official@gmail.com"
        };

        var cart = [];
        var allowLocalStorage = true;

        function sanitize(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function openModal(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.display = 'flex';
            }
            window.location.hash = id;
        }

        function closeModal(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
            }
            window.location.hash = 'store';
        }

        function setStorageConsent(status) {
            allowLocalStorage = status;
            var banner = document.getElementById('cookieBanner');
            if (banner) banner.style.display = 'none';
            if (!status) {
                try { localStorage.removeItem('ll_orders'); } catch(e) {}
            }
        }

        function addToCart(id, title, price) {
            cart.push({ id: id, title: title, price: price });
            updateCart();
            openModal('cartModal');
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            updateCart();
        }

        function updateCart() {
            var countEl = document.getElementById('cartCount');
            if (countEl) countEl.innerText = cart.length;

            var container = document.getElementById('cartItemsList');
            var total = 0;
            for (var i = 0; i < cart.length; i++) {
                total += cart[i].price;
            }

            var totalEl = document.getElementById('cartTotal');
            if (totalEl) totalEl.innerText = "₹" + total;

            if (container) {
                if (cart.length === 0) {
                    container.innerHTML = '<p style="color: #8e95a5; font-size: 0.85rem; padding: 10px 0;">Your shopping bag is empty.</p>';
                } else {
                    var html = '';
                    for (var j = 0; j < cart.length; j++) {
                        html += '<div class="cart-line">' +
                            '<span>' + sanitize(cart[j].title) + '</span>' +
                            '<div>' +
                                '<span style="color: #d4af37; margin-right: 12px;">₹' + cart[j].price + '</span>' +
                                '<span style="color: #ff4757; cursor:pointer; font-weight:bold;" onclick="removeFromCart(' + j + ')">✕</span>' +
                            '</div>' +
                        '</div>';
                    }
                    container.innerHTML = html;
                }
            }

            var upiLinkBtn = document.getElementById('directUpiLink');
            if (upiLinkBtn) {
                if (total > 0) {
                    upiLinkBtn.href = "upi://pay?pa=" + CONFIG.upiId + "&pn=" + encodeURIComponent(CONFIG.storeName) + "&am=" + total + "&cu=INR";
                } else {
                    upiLinkBtn.href = "upi://pay?pa=" + CONFIG.upiId + "&pn=" + encodeURIComponent(CONFIG.storeName) + "&cu=INR";
                }
            }
        }

        function toggleUpiAccess() {
            var c1 = document.getElementById('checkTerms').checked;
            var c2 = document.getElementById('checkPrivacy').checked;
            var c3 = document.getElementById('checkAge').checked;
            var box = document.getElementById('upiPaymentSection');
            if (box) {
                box.style.display = (c1 && c2 && c3) ? 'block' : 'none';
            }
        }

        function processOrderAutomated() {
            var name = sanitize(document.getElementById('custName').value.trim());
            var phone = sanitize(document.getElementById('custPhone').value.trim());
            var address = sanitize(document.getElementById('custAddress').value.trim());
            var utr = sanitize(document.getElementById('custUtr').value.trim());

            var c1 = document.getElementById('checkTerms').checked;
            var c2 = document.getElementById('checkPrivacy').checked;
            var c3 = document.getElementById('checkAge').checked;

            if (!name || !/^[6-9]\d{9}$/.test(phone) || address.length < 8) {
                alert("Please enter your full name, a valid 10-digit Indian mobile number, and your complete delivery address.");
                return;
            }
            if (!c1 || !c2 || !c3) {
                alert("Please tick all 3 consent checkboxes before booking your order.");
                return;
            }
            if (cart.length === 0) {
                alert("Your shopping bag is empty. Tap 'Add To Bag' on a product first.");
                return;
            }
            if (utr.length < 6) {
                alert("Please pay via the UPI button first, then enter your 12-digit UPI Reference / UTR Number in Step 2 so the owner can verify your payment.");
                return;
            }

            var total = 0;
            var itemNames = [];
            for (var i = 0; i < cart.length; i++) {
                total += cart[i].price;
                itemNames.push(cart[i].title + " (₹" + cart[i].price + ")");
            }

            var orderId = "LL-" + Math.floor(100000 + Math.random() * 900000);
            var orderDate = new Date().toLocaleString('en-IN');
            var itemsString = itemNames.join(', ');

            var btn = document.getElementById('submitOrderBtn');
            if (btn) {
                btn.innerText = "Sending Order to Owner...";
                btn.disabled = true;
            }

            fetch("https://formsubmit.co/ajax/" + CONFIG.ownerEmail, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    _subject: "New Order Pending Owner Check: " + orderId + " (₹" + total + ")",
                    Order_ID: orderId,
                    Order_Status: "Pending Owner Verification",
                    Customer_Name: name,
                    Mobile_Number: phone,
                    Delivery_Address: address,
                    Ordered_Items: itemsString,
                    Total_Amount: "₹" + total,
                    UPI_UTR_Number: utr,
                    Order_Time: orderDate,
                    DPDP_Consent: "Verified (Terms + Privacy + 18+ Age)"
                })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                completeOrderLocally(orderId, itemsString, total, utr, orderDate, btn);
            })
            .catch(function(err) {
                completeOrderLocally(orderId, itemsString, total, utr, orderDate, btn);
            });
        }

        function completeOrderLocally(orderId, itemsString, total, utr, orderDate, btn) {
            if (btn) {
                btn.innerText = "Send Order for Owner Confirmation";
                btn.disabled = false;
            }

            if (allowLocalStorage) {
                var saved = [];
                try { saved = JSON.parse(localStorage.getItem('ll_orders') || '[]'); } catch(e) {}
                saved.unshift({
                    order_id: orderId,
                    items: itemsString,
                    total: "₹" + total,
                    utr: utr,
                    status: "Pending Owner Confirmation",
                    date: orderDate
                });
                try { localStorage.setItem('ll_orders', JSON.stringify(saved)); } catch(e) {}
            }

            alert("Order " + orderId + " Sent to Owner!\n\n• Status: Pending Owner Verification\n• Amount: ₹" + total + " (UTR: " + utr + ")\n• The store owner will verify your payment and confirm your order.\n• Delivery takes 21 to 25 working days after confirmation.");
            cart = [];
            document.getElementById('custUtr').value = "";
            document.getElementById('checkTerms').checked = false;
            document.getElementById('checkPrivacy').checked = false;
            document.getElementById('checkAge').checked = false;
            toggleUpiAccess();
            updateCart();
            closeModal('cartModal');
        }

        function renderOrders() {
            var list = document.getElementById('localOrdersList');
            if (!list) return;

            var saved = [];
            try { saved = JSON.parse(localStorage.getItem('ll_orders') || '[]'); } catch(e) {}

            if (saved.length === 0) {
                list.innerHTML = '<p style="font-size: 0.85rem; color: #8e95a5;">No saved orders on this device.</p>';
                return;
            }

            var out = '';
            for (var i = 0; i < saved.length; i++) {
                var o = saved[i];
                var statusText = o.status ? o.status : "Pending Owner Confirmation";
                out += '<div style="background: #0d0f12; border: 1px solid #292d38; padding: 12px; border-radius: 10px; margin-bottom: 10px;">' +
                    '<div style="display:flex; justify-content:space-between; font-weight:700; font-size: 0.9rem;">' +
                        '<span>' + sanitize(o.order_id) + '</span>' +
                        '<span style="color: #d4af37;">' + sanitize(o.total) + '</span>' +
                    '</div>' +
                    '<div style="font-size: 0.75rem; color: #8e95a5; margin-top: 4px;">Items: ' + sanitize(o.items) + '</div>' +
                    '<div style="font-size: 0.74rem; color: #d4af37; margin-top: 3px;">Status: ' + sanitize(statusText) + ' (UTR: ' + sanitize(o.utr || 'N/A') + ')</div>' +
                    '<div style="font-size: 0.72rem; color: #666; margin-top: 2px;">Booked on ' + sanitize(o.date) + '</div>' +
                '</div>';
            }
            list.innerHTML = out;
        }

        function withdrawConsentAndDelete() {
            try { localStorage.removeItem('ll_orders'); } catch(e) {}
            cart = [];
            updateCart();
            renderOrders();
            alert("Consent Withdrawn: Your saved order history and local storage data have been permanently deleted from this device.");
        }

        window.addEventListener('DOMContentLoaded', function() {
            renderOrders();
        });
    </script>
